name: itantra_app
description: "Offline P2P Multilingual Tactical Transceiver"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sherpa_onnx: ^1.13.8
  record: ^7.1.1
  nearby_connections: ^4.3.0
  flutter_blue_plus: ^2.3.12
  msgpack_dart: ^1.0.1
  shared_preferences: ^2.5.5
  ffi: ^2.2.0
  path_provider: ^2.1.6
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/locales/
    - assets/models/vad/
    - assets/models/stt/
    - assets/models/nlu/
    - assets/models/nmt/
    - assets/models/tts/
